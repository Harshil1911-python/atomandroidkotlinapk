<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>Calculator · Atom Bills</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#f1f5f9}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:#f8fafc;overflow:hidden;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#fff;border-bottom:1px solid #e2e8f0;flex-shrink:0}
.top h1{font-size:16px;font-weight:700;color:#0f172a}
.top button{border:0;background:#f1f5f9;width:34px;height:34px;border-radius:10px;font-size:18px;color:#64748b}
.display{flex-shrink:0;padding:10px 14px;margin:8px 12px 4px;background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(15,23,42,.06);min-height:70px;max-height:120px;overflow-y:auto;display:flex;flex-direction:column;justify-content:flex-end}
.gst-row{font-size:11px;color:#64748b;text-align:right;min-height:14px;font-weight:500}
.hist{font-size:12px;color:#94a3b8;text-align:right;min-height:15px;margin:2px 0;white-space:pre-line;word-break:break-all}
.res{font-size:26px;font-weight:800;text-align:right;color:#0f172a;line-height:1.2;word-break:break-all}
.keys{flex:1;padding:6px 10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;min-height:0}
.row{display:grid;gap:6px;flex:1}
.row.r4{grid-template-columns:repeat(4,1fr)}
button.k{border:0;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;background:#fff;color:#0f172a;box-shadow:0 1px 6px rgba(15,23,42,.06);min-height:0}
button.k:active{transform:scale(.96);opacity:.9}
button.k.fn{background:#f1f5f9;color:#475569;font-size:12px}
button.k.op{background:#e2e8f0;color:#0f172a}
button.k.num{background:#1e293b;color:#fff}
button.k.ac{background:#f97316;color:#fff}
button.k.eq{background:#334155;color:#fff}
button.k.gst{background:#4f46e5;color:#fff;font-size:12px}
button.k.imp{background:#059669;color:#fff;font-size:11px}
button.k.exp{background:#0f172a;color:#fff;font-size:11px}
.modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45)}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;width:88%;max-width:320px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mhd{padding:14px 16px;font-weight:700;font-size:15px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.mhd button{border:0;background:0;font-size:20px;color:#64748b}
.mbd{padding:14px 16px 18px}
.mbd p{font-size:13px;color:#64748b;margin-bottom:12px;font-weight:500}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rates button{padding:12px;border:0;border-radius:12px;background:#f1f5f9;font-weight:700;font-size:14px;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.row2 label{font-size:11px;font-weight:600;color:#64748b;display:block;margin-bottom:4px}
.row2 input{width:100%;padding:11px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;font-weight:700;font-family:inherit;outline:0}
.row2 .go{padding:12px 18px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:700;font-size:14px;font-family:inherit}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:99;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>Calculator</h1><button type="button" id="close">×</button></div>
  <div class="display">
    <div class="gst-row" id="gstRow"></div>
    <div class="hist" id="hist"></div>
    <div class="res" id="res">0</div>
  </div>
  <div class="keys">
    <div class="row r4">
      <button class="k fn" data-k="GT">GT</button>
      <button class="k fn" data-k="MU">MU</button>
      <button class="k gst" data-k="+GST">GST+</button>
      <button class="k gst" data-k="-GST">GST−</button>
    </div>
    <div class="row r4">
      <button class="k imp" data-k="IMPORT">Import Cart</button>
      <button class="k exp" data-k="EXPORT">Export Cart</button>
      <button class="k op" data-k="%">%</button>
      <button class="k ac" data-k="AC">AC</button>
    </div>
    <div class="row r4">
      <button class="k num" data-k="7">7</button>
      <button class="k num" data-k="8">8</button>
      <button class="k num" data-k="9">9</button>
      <button class="k op" data-k="÷">÷</button>
    </div>
    <div class="row r4">
      <button class="k num" data-k="4">4</button>
      <button class="k num" data-k="5">5</button>
      <button class="k num" data-k="6">6</button>
      <button class="k op" data-k="×">×</button>
    </div>
    <div class="row r4">
      <button class="k num" data-k="1">1</button>
      <button class="k num" data-k="2">2</button>
      <button class="k num" data-k="3">3</button>
      <button class="k op" data-k="-">−</button>
    </div>
    <div class="row r4">
      <button class="k num" data-k="0">0</button>
      <button class="k num" data-k="00">00</button>
      <button class="k num" data-k=".">.</button>
      <button class="k op" data-k="+">+</button>
    </div>
    <div class="row r4">
      <button class="k eq" data-k="=" style="grid-column:span 4">=</button>
    </div>
  </div>
  <div class="modal" id="gstM">
    <div class="mbox">
      <div class="mhd"><span id="gstTitle">GST</span><button type="button" id="gstX">×</button></div>
      <div class="mbd">
        <p id="gstHint">Choose rate</p>
        <div class="rates">
          <button type="button" data-r="5">5%</button>
          <button type="button" data-r="12">12%</button>
          <button type="button" data-r="18">18%</button>
          <button type="button" data-r="28">28%</button>
        </div>
        <div class="row2">
          <div><label>Custom %</label><input id="gstCustom" type="number" min="0" step="0.01" placeholder="18"></div>
          <button type="button" class="go" id="gstApply">Apply</button>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
document.addEventListener("contextmenu",e=>e.preventDefault());
const $=s=>document.querySelector(s);
let expr='',display='0',gt=0,gstMode=null,gstBase=0,justEquals=false;
// lines for export: {qty, price, line} from pattern qty × price =
let exportLines=[];
const hist=$('#hist'),res=$('#res'),gstRow=$('#gstRow');
function n(v){return Math.round((+v)*1e8)/1e8}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
function upd(h){res.textContent=display;if(h!==undefined)hist.textContent=h}
function val(){try{if(!expr)return +display||0;return n(Function('"use strict";return('+(expr.replace(/×/g,'*').replace(/÷/g,'/'))+')')())}catch{return NaN}}
function openGst(mode){
  gstMode=mode;gstBase=val()||+display||0;
  $('#gstTitle').textContent=mode==='MU'?'Markup %':(mode==='+GST'?'Add GST':'Remove GST');
  $('#gstHint').textContent=mode==='MU'?'Markup on '+gstBase:(mode==='+GST'?'Add GST on '+gstBase:'Remove GST from '+gstBase);
  $('#gstCustom').value=mode==='MU'?'10':'18';
  $('#gstM').classList.add('on');
}
function applyGst(rate){
  rate=+rate||0;let r=gstBase,sub='';
  if(gstMode==='MU'){r=n(gstBase*(1+rate/100));sub=gstBase+' +'+rate+'% = '+r}
  else if(gstMode==='+GST'){const tax=n(gstBase*rate/100);r=n(gstBase+tax);gstRow.textContent='GST: '+tax+'  CGST: '+n(tax/2)+'  SGST: '+n(tax/2);sub=gstBase+' + GST '+rate+'% = '+r}
  else{r=n(gstBase/(1+rate/100));const tax=n(gstBase-r);gstRow.textContent='GST: '+tax+'  CGST: '+n(tax/2)+'  SGST: '+n(tax/2);sub=gstBase+' − GST '+rate+'% = '+r}
  display=String(r);expr=String(r);justEquals=true;upd(sub);$('#gstM').classList.remove('on');
}
function parseMulLine(expression){
  // detect a × b or a * b (qty × price)
  const m=String(expression).match(/^([\d.]+)\s*[×*xX]\s*([\d.]+)$/);
  if(!m)return null;
  return {qty:+m[1],price:+m[2],line:n((+m[1])*(+m[2]))};
}
function importCart(){
  try{
    const raw=localStorage.getItem('atom_calc_cart');
    if(!raw){toast('Cart empty');return}
    const items=JSON.parse(raw);
    if(!items||!items.length){toast('Cart empty');return}
    let lines=[],total=0;
    exportLines=[];
    items.forEach(it=>{
      const q=+it.qty||1,p=+it.price||0,line=n(q*p);
      total+=line;
      lines.push(q+' × '+p+' = '+line);
      exportLines.push({qty:q,price:p,line,name:it.name||('Item')});
    });
    lines.push('Total = '+n(total));
    display=String(n(total));expr=String(n(total));justEquals=true;gt=n(gt+total);
    gstRow.textContent='';upd(lines.join('\n'));
  }catch(e){toast('Import failed')}
}
function exportCart(){
  if(!exportLines.length){
    // try last expression as single line
    const one=parseMulLine(expr)||parseMulLine(hist.textContent.split('\n').pop()||'');
    if(one)exportLines=[{qty:one.qty,price:one.price,line:one.line,name:'Item'}];
  }
  if(!exportLines.length){toast('Nothing to export — use qty × price =');return}
  try{
    const payload=exportLines.map((l,i)=>({
      id:'calc_'+Date.now()+'_'+i,
      name:l.name||('Item '+(i+1)),
      price:+l.price||0,
      qty:+l.qty||1
    }));
    localStorage.setItem('atom_export_cart',JSON.stringify(payload));
    toast('Exported '+payload.length+' item(s) → Cart');
    // navigate to billing cart
    setTimeout(()=>{location.href='billing.html#cart'},400);
  }catch(e){toast('Export failed')}
}
function press(k){
  if(k==='AC'){expr='';display='0';justEquals=false;exportLines=[];gstRow.textContent='';upd('');return}
  if(k==='GT'){
    // show grand total; second press clears GT
    if(display.startsWith('GT ')||hist.textContent.startsWith('GT ')){
      gt=0;display='0';expr='';justEquals=false;upd('GT cleared');return;
    }
    display=String(gt);expr=String(gt);justEquals=true;upd('GT '+gt);return;
  }
  if(k==='MU'){openGst('MU');return}
  if(k==='+GST'){openGst('+GST');return}
  if(k==='-GST'){openGst('-GST');return}
  if(k==='IMPORT'){importCart();return}
  if(k==='EXPORT'){exportCart();return}
  if(k==='%'){const v=val()||+display||0;display=String(n(v/100));expr=display;justEquals=true;upd();return}
  if(k==='='){
    const before=expr||display;
    const r=val();
    if(isNaN(r)){display='Err';expr='';justEquals=false;upd();return}
    gt=n(gt+r);
    // capture qty × price lines for export
    const parsed=parseMulLine(before.replace(/\s/g,'').replace(/×/g,'×'));
    // also try with spaces: 2 × 3
    const parsed2=parseMulLine(before.trim());
    const p=parsed2||parsed;
    if(p)exportLines.push({qty:p.qty,price:p.price,line:p.line,name:'Item'});
    display=String(r);
    const prev=hist.textContent&&!hist.textContent.startsWith('GT')?hist.textContent+'\n':'';
    upd(prev+before+' = '+r);
    expr=String(r);justEquals=true;return;
  }
  if(['+','-','×','÷'].includes(k)){
    if(justEquals){expr=display;justEquals=false}
    else if(!expr&&display!=='0')expr=display;
    const c=expr.slice(-1);
    expr=(['+','-','×','÷'].includes(c)?expr.slice(0,-1):expr)+k;display=expr;upd();return;
  }
  if(justEquals){expr='';display='0';justEquals=false;gstRow.textContent=''}
  if(display==='0'||display==='Err'||expr==='0'){expr=k==='.'?'0.':k;display=expr}
  else{expr+=k;display=expr}
  upd();
}
document.querySelectorAll('button.k').forEach(b=>b.onclick=()=>press(b.dataset.k));
$('#gstX').onclick=()=>$('#gstM').classList.remove('on');
$('#gstApply').onclick=()=>applyGst($('#gstCustom').value);
document.querySelectorAll('.rates button').forEach(b=>b.onclick=()=>applyGst(b.dataset.r));
$('#close').onclick=()=>history.length>1?history.back():location.href='billing.html';
window.addEventListener('popstate',()=>location.href='billing.html');
history.pushState({c:1},'','calculator.html');
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k>='0'&&k<='9')press(k);else if(k==='.')press('.');else if(k==='+')press('+');else if(k==='-')press('-');
  else if(k==='*')press('×');else if(k==='/'){e.preventDefault();press('÷')}else if(k==='Enter'||k==='='){e.preventDefault();press('=')}
  else if(k==='Backspace'){if(justEquals){expr='';display='0';justEquals=false}else{expr=expr.slice(0,-1);display=expr||'0'}upd()}
  else if(k==='Escape'){if($('#gstM').classList.contains('on'))$('#gstM').classList.remove('on');else $('#close').click()}
  else if(k==='c'||k==='C')press('AC');
});
</script>
</body>
</html>
